<aside class="sidebar">
  <button class="sidebar-close-btn" id="sidebar-close-btn" aria-label="Close menu">
    <i class="bi bi-x-lg"></i>
  </button>
  <a href="{{ url_for('main.index') }}" class="sidebar-logo" style="text-decoration:none;">Split<span>Mate</span></a>

  <div class="sidebar-section-label">Navigation</div>
  <a href="{{ url_for('main.index') }}" class="nav-item-btn {{ 'active' if active_page == 'home' }}"><i class="bi bi-house"></i> Home</a>

  {% if sidebar_groups %}
  <div class="sidebar-section-label" style="margin-top:16px;">Groups</div>
  <div class="sidebar-groups-list">
    {% for g in sidebar_groups %}
    <a href="{{ url_for('main.group_dashboard', group_id=g.id) }}" class="sidebar-group-item {{ 'active' if group is defined and group and group.id == g.id }}">
      <div class="sidebar-group-name">{{ g.name }}</div>
      <div class="sidebar-group-meta">
        {{ g.member_count }} member{{ 's' if g.member_count != 1 }}
        {% if g.balance != 0 %}
        <span style="color: {{ 'var(--accent)' if g.balance >= 0 else 'var(--danger)' }}">
          {{ '+' if g.balance > 0 }}${{ "%.2f"|format(g.balance|abs) }}
        </span>
        {% endif %}
      </div>
    </a>
    {% endfor %}
  </div>
  {% endif %}


  <div class="sidebar-bottom">
    <a href="{{ url_for('main.profile') }}" class="nav-item-btn {{ 'active' if active_page == 'profile' }}"><i class="bi bi-person-circle"></i> Profile</a>
    <form method="POST" action="{{ url_for('main.logout') }}" style="margin:0;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <button type="submit" class="nav-item-btn" style="width:100%;background:none;border:none;text-align:left;cursor:pointer;">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </form>
  </div>
</aside>
